[package]
name = "arhitectureByClaudeIBET"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2", features = ["essentials", "consensus", "eips", "network", "signer-local", "eip712", "dyn-abi"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
dotenv = "0.15"
rand = "0.10.3"
rpassword = "7.3.1"
eth-keystore = "0.5.0"
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3"
